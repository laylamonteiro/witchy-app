buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Define flutter properties for plugins that need them
    ext {
        set('flutter.compileSdkVersion', 36)
        set('flutter.minSdkVersion', 21)
        set('flutter.targetSdkVersion', 36)
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Suporte a páginas de 16 KB (exigência do Play para Android 15+): plugins
// com código nativo (ex.: sweph/libsweph.so) compilam com o NDK do PRÓPRIO
// plugin, que pode ser antigo e gerar .so desalinhado. Força o NDK 28 (que
// alinha em 16 KB por padrão) em todos os subprojetos Android.
subprojects { project ->
    def forceNdk = {
        if (project.hasProperty('android')) {
            project.android.ndkVersion = "28.2.13676358"
            // O app é minSdk 24; plugins que declaram menos (sweph: 16)
            // compilariam o C contra uma plataforma onde fseeko/ftello não
            // existem em 32-bit — e o clang do NDK 28 trata declaração
            // implícita como ERRO. Nivelar em 24 resolve.
            project.android.defaultConfig.minSdk = 24
        }
    }
    // O :app já foi avaliado pelo evaluationDependsOn acima — nele o ajuste
    // é imediato; nos plugins, após a avaliação de cada um.
    if (project.state.executed) {
        forceNdk()
    } else {
        project.afterEvaluate { forceNdk() }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
