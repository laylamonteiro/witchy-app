<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Espelho mágico</title>
  <desc>Espelho mágico estilizado com reflexos astrais na paleta lilás, rosa, menta e dourado do app.</desc>

  <!-- Brilhos astrais -->
  <rect x="8" y="7" width="2" height="2" fill="#FFE8A3" opacity="0.9"/>
  <rect x="38" y="10" width="2" height="2" fill="#FFE8A3" opacity="0.85"/>
  <rect x="5" y="31" width="2" height="2" fill="#A7F0D8" opacity="0.75"/>
  <path d="M36 29h2v2h2v2h-2v2h-2v-2h-2v-2h2v-2Z" fill="#F1A7C5" opacity="0.85"/>

  <!-- Cabo e base -->
  <rect x="22" y="34" width="4" height="7" rx="1" fill="#6B4BA6"/>
  <rect x="20" y="40" width="8" height="3" rx="1.5" fill="#8B5FD6"/>
  <rect x="17" y="43" width="14" height="2" rx="1" fill="#C9A7FF" opacity="0.9"/>

  <!-- Moldura do espelho -->
  <ellipse cx="24" cy="21" rx="13" ry="16" fill="#8B5FD6"/>
  <ellipse cx="24" cy="21" rx="10" ry="13" fill="#0B0A16"/>
  <ellipse cx="24" cy="21" rx="8" ry="11" fill="#171425"/>
  <path d="M18 15c2-4 8-5 12-1-6 1-9 5-10 12-3-3-3-7-2-11Z" fill="#C9A7FF" opacity="0.35"/>
  <path d="M28 12c4 2 6 7 4 12-2-4-5-7-10-8 2-2 4-3 6-4Z" fill="#A7F0D8" opacity="0.25"/>

  <!-- Detalhes mágicos -->
