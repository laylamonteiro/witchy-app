  <path d="M24 14v3M24 25v3M17 21h3M28 21h3" stroke="#FFE8A3" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M14 21c0-7 4-13 10-15 6 2 10 8 10 15" stroke="#F6F4FF" stroke-width="1" opacity="0.25"/>
  <path d="M14 29c2 5 6 8 10 8s8-3 10-8" stroke="#C9A7FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
