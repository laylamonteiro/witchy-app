<head>

  <meta property="og:site_name" content="Grimório de Bolso">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Grimório de Bolso">
  <meta property="og:description" content="Agenda mágica, diário de bruxaria, calendário lunar, astrologia e enciclopédia — a sua prática no bolso, no celular ou no navegador.">
  <meta property="og:url" content="https://grimoriodebolso.app/">
  <meta property="og:image" content="https://grimoriodebolso.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1129">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Grimório de Bolso — agenda mágica, calendário lunar, grimório digital e astrologia">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Grimório de Bolso">
  <meta name="twitter:description" content="Agenda mágica, diário de bruxaria, calendário lunar, astrologia e enciclopédia — a sua prática no bolso, no celular ou no navegador.">
  <meta name="twitter:image" content="https://grimoriodebolso.app/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Grimório de Bolso">
  <!-- O iOS não respeita transparência: o ícone redondo virava um círculo
       com cantos pretos na tela de início. Este tem fundo opaco. -->

  <!-- Favicon -->

  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services: a entrada com o Google acontece DENTRO desta
       página, sem redirecionar para accounts.google.com. Sem isso, a página
       do Google fica no histórico da aba e o voltar acaba lá. `async` para
       não atrasar o primeiro desenho: quem usa confere se já carregou. -->
  <script src="https://accounts.google.com/gsi/client" async></script>

  <style>
    /* O fundo da página aparece em qualquer sobra; com a cor do app, some. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0B0A16;
    }
    /* A view do Flutter acompanha a altura da página (que o script abaixo
       mantém igual à área realmente visível do navegador). */
    flutter-view, flt-glass-pane {
      height: 100%;
    }

    /* Tela de carregamento: só o logo, sem texto. Aparece enquanto o app (que
       é grande) baixa e some quando ele sobe — inclusive na volta do login
       social, que recarrega a página inteira. A pulsação suave evita a
       sensação de tela travada durante o download.

       NOTA: este arquivo é o APP, servido na raiz. A apresentação em HTML
       estático — com nome, propósito e links legais, que um rastreador
       consegue ler — fica em /sobre/ (site/sobre/index.html). Por isso aqui
       pode ser só o logo. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0A16;
      transition: opacity .35s ease;
    }
    #boot-splash.done { opacity: 0; pointer-events: none; }
    #boot-splash img {
      width: 128px;
      height: 128px;
      animation: boot-pulse 1.8s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { opacity: .55; transform: scale(.97); }
      50%      { opacity: 1;   transform: scale(1); }
    }
    /* Quem prefere menos movimento vê o logo estático. */
    @media (prefers-reduced-motion: reduce) {
      #boot-splash img { animation: none; opacity: 1; }
    }
  </style>

  <script>
    // O CORRIMÃO DO VOLTAR — a primeira coisa que este documento faz.
    //
    // O motor do Flutter mantém UMA entrada sua no histórico (a "guarda") e a
    // repõe DENTRO do tratador de `popstate`. Quando essa única entrada não
    // sobrevive ao gesto — porque o Chrome marcou as entradas deste documento
    // como puláveis, ou porque a thread principal estava ocupada —, o voltar
    // vai direto para o navegador, que não tem mais para onde ir e FECHA A
    // ABA. É o relato de 23-24/08: uma deslizada, de dentro de uma lição, e a
    // aba some. Nenhuma linha de Dart roda nesse caminho, e foi por isso que
    // as correções do lado Dart não mudaram nada.
    //
    // A folga tem de morar do lado do navegador: são estes DEGRAUS. O estado
    // de cada um é `{flutter: true, gdb_degrau: n}` porque o motor classifica
    // entradas pelo estado — `_isFlutterEntry` é literalmente
    // `state is Map && state['flutter'] == true` (engine 3.47.0,
    // web_ui/.../navigation/history.dart) — e ignora chaves extras. Ao
    // aterrissar num degrau ele NÃO empurra nada: manda um `pushRoute` para o
    // app, que o PorteiroDoVoltar converte num voltar de verdade.
    //
    // NÃO mexer nisto sem reler `history.dart` do motor: um estado que não
    // seja `origin` nem `flutter` faz o motor responder com `go(-1)` EM
    // CASCATA, e aí um voltar leva a aba para fora do app.
    (function () {
      // Cada degrau compra um voltar. O polegar repete ~5 vezes por segundo;
      // 8 cobre uma deslizada nervosa inteira, e a lista de histórico da aba
      // fica com 8 entradas repetidas, não 30.
      var ALVO = 8;
      var CHAVE = 'gdb_degrau';

      // Documento de retorno do login social: não erguer NADA. Ele é
      // transitório (o AuthWrapper chama `recomecarNaRaiz()` logo em seguida)
      // e os degraus daqui ficariam com o código de autorização na URL,
      // empilhados embaixo do documento novo para sempre.
      var busca = window.location.search;
      var fragmento = window.location.hash;
      if (busca.indexOf('code=') !== -1 ||
          fragmento.indexOf('access_token') !== -1 ||
          fragmento.indexOf('error=') !== -1) {
        return;
      }

      // Quantos degraus temos abaixo. Em memória, e não lido do
      // `history.state`, porque o motor REESCREVE o estado do topo a cada
      // rota anunciada (`setRouteName` grava `{flutter:true}` puro, sem a
      // nossa chave) — quem confiasse na marca do topo se perderia.
      var nivel = 0;

      function degrau(n) {
        var estado = { flutter: true };
        estado[CHAVE] = n;
        return estado;
      }

      function subirAte(alvo) {
        for (var n = nivel + 1; n <= alvo; n++) {
          history.pushState(degrau(n), '', window.location.href);
          nivel = n;
        }
      }

      try {
        // A entrada em que aterrissamos vira o degrau 0. Marcá-la é
        // obrigatório: sem marca, um voltar que chegue nela cai no ramo
        // "estado desconhecido" do motor, que responde com `go(-1)` e SAI do
        // documento.
        //
        // E SÓ ISSO no carregamento: nenhum degrau é empurrado aqui.
        //
        // Medido no aparelho da dona (24/08, com `?diag=1`): os 8 degraus
        // empurrados no boot compraram UM voltar. No segundo, o contador de
        // `popstate` congelou e a aba fechou — o Chrome pulou todos de uma
        // vez. É a intervenção de manipulação de histórico: entrada empurrada
        // SEM gesto da pessoa nasce pulável, e depois de um voltar o navegador
        // deixa de honrar ativação antiga.
        //
        // Por isso os degraus agora nascem no PRIMEIRO TOQUE (ver `repor`
        // abaixo). Com ativação, a entrada não é marcada. O custo é a janela
        // entre abrir o app e encostar na tela, em que não há degrau nenhum —
        // e ela é aceitável porque para chegar a qualquer lugar de onde o
        // voltar importa é preciso tocar na tela antes.
        history.replaceState(degrau(0), '', window.location.href);
      } catch (e) {
        // Histórico é conforto: nunca derrubar o boot por causa dele.
      }

      // Cada voltar consome um degrau.
      window.addEventListener('popstate', function (evento) {
        var estado = evento.state;
        if (estado && typeof estado === 'object' &&
            typeof estado[CHAVE] === 'number') {
          nivel = estado[CHAVE];
        }
      });

      // OS DEGRAUS NASCEM AQUI, no gesto — e é o gesto que os protege.
      //
      // Entrada empurrada durante um `pointerdown`/`keydown` tem ativação
      // transitória do usuário, e é essa ativação que a impede de ser marcada
      // como pulável. Nunca repomos dentro do `popstate`: ali não há ativação
      // nenhuma, e a entrada nasceria condenada.
      //
      // Roda a cada toque, de graça quando já está cheio (o `subirAte` não
      // tem o que empurrar).
      var repor = function () {
        try {
          if (nivel < ALVO) subirAte(ALVO);
        } catch (e) {}
      };
      window.addEventListener('pointerdown', repor, { capture: true, passive: true });
      window.addEventListener('keydown', repor, { capture: true });

      // A JANELINHA DE DIAGNÓSTICO — só aparece com `?diag=1` no endereço.
      //
      // Existe porque a medição que faltava não é obtível de fora: o Chrome
      // 151 no Android não tem mais o menu de pressão longa que mostrava a
      // pilha de voltar da aba, e o `chrome://history` mostra visitas, não
      // entradas de histórico. Sem isto, saber se os degraus existem no
      // aparelho dela depende de adivinhação — e já foram quatro.
      //
      // Ela mostra, ao vivo e no momento do gesto: o tamanho do histórico, em
      // que degrau estamos, o que o motor veria no estado atual, e quantos
      // `popstate` este documento recebeu. Se a aba fechar com `popstates`
      // parado, o voltar nunca chegou ao documento.
      if (window.location.search.indexOf('diag=1') === -1) return;

      var popstates = 0;
      var ultimos = [];
      var caixa = document.createElement('div');
      caixa.style.cssText =
        'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;' +
        'background:rgba(0,0,0,.85);color:#8CE99A;font:11px/1.35 monospace;' +
        'padding:6px 8px;pointer-events:none;white-space:pre-wrap;';

      function classificar(estado) {
        if (!estado || typeof estado !== 'object') return 'DESCONHECIDO';
        if (typeof estado[CHAVE] === 'number') return 'degrau' + estado[CHAVE];
        if (estado.flutter === true) return 'guarda-do-motor';
        if (estado.origin === true) return 'origem-do-motor';
        return 'outro';
      }

      function pintar() {
        caixa.textContent =
          'len=' + history.length + '  nivel=' + nivel +
          '  aqui=' + classificar(history.state) +
          '  popstates=' + popstates +
          // Quantos voltares o APP tratou (o porteiro do lado Dart escreve
          // aqui). `popstates` maior que `dart` significa que o gesto chegou
          // ao documento e não chegou ao app — defeito nosso, não do
          // navegador.
          '  dart=' + (window.__gdbVoltaresDart || 0) +
          '\n' + (ultimos.slice(-5).join('  |  ') || '(nenhum voltar ainda)');
      }

      window.addEventListener('popstate', function (evento) {
        popstates++;
        ultimos.push('#' + popstates + ' ' + classificar(evento.state));
        pintar();
      });
      window.addEventListener('pointerdown', pintar, { capture: true, passive: true });

      document.addEventListener('DOMContentLoaded', function () {
        document.body.appendChild(caixa);
        pintar();
      });
      // O motor reescreve o estado do topo a cada rota anunciada, então a
      // janelinha se repinta sozinha para não mostrar número velho.
      setInterval(pintar, 1000);
      pintar();
    })();
  </script>

  <script>
    // TECLADO DO CELULAR: o canvas do Flutter não volta ao tamanho quando o
    // teclado fecha, deixando uma faixa vazia no fim da página. A meta tag
    // `interactive-widget` sozinha não resolveu, então aqui a altura da página
    // passa a acompanhar a área visível de fato (visualViewport), que encolhe
    // quando o teclado abre e volta quando ele fecha. O Flutter observa o
    // tamanho do host e refaz o layout junto.
    (function () {
      var viewport = window.visualViewport;
      if (!viewport) return;

      var applyHeight = function () {
        var height = Math.round(viewport.height) + 'px';
        document.documentElement.style.height = height;
        document.body.style.height = height;
      };

      viewport.addEventListener('resize', applyHeight);
      window.addEventListener('orientationchange', function () {
        // A rotação só reporta o tamanho novo no quadro seguinte.
        setTimeout(applyHeight, 150);
      });
      applyHeight();
    })();
  </script>

  <script>
    // VOLTAR DEPOIS DO LOGIN SOCIAL: quando a entrada com o Google cai no
    // redirecionamento, o histórico da aba guarda o documento de ANTES do
    // login — o app congelado na tela de entrada. O voltar restaura esse
    // documento do bfcache exatamente como ele estava: a pessoa vê a tela
    // de login e conclui que foi deslogada. Não foi — o avançar "devolve"
    // a conta, mas ninguém aperta avançar. E nenhum guarda DENTRO do app
    // (PopScope, GuestOnly) alcança isso, porque o documento restaurado é
    // outra instância do app, com o estado de antes do login.
    //
    // A saída é recarregar sempre que a página voltar do bfcache: o boot
    // relê a sessão do localStorage — que é compartilhado entre os
    // documentos e continua viva — e escolhe a tela pelo estado REAL.
    // Com sessão, Home; sem, entrada. Restauro de bfcache só acontece ao
    // navegar ENTRE documentos (login social, link externo), então isto
    // não toca a navegação normal dentro do app, que é de documento único.
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) { window.location.reload(); }
    });
  </script>
</head>
<body>
  <!--
    NÃO registrar o sqflite_sw.js como service worker aqui. O pacote
    sqflite_common_ffi_web instancia esse arquivo como SharedWorker por
    conta própria (dentro de databaseFactoryFfiWeb) — registrá-lo como
    service worker fazia o SW interceptar o fetch do sqlite3.wasm e
    devolver vazio, estourando "unsupported result null" no boot a partir
    do segundo load, além de sobrescrever o flutter_service_worker.js do PWA.
  -->
  <div id="boot-splash">
    <img src="/icons/Icon-512.png" alt="Grimório de Bolso">
  </div>

  <script>
    // Tira a tela de carregamento assim que o Flutter monta a própria view.
    // Sem tempo-limite de propósito: se o app não subir, é melhor a pessoa
    // continuar vendo o nome e os links do que uma tela vazia.
    (function () {
      var splash = document.getElementById('boot-splash');
      if (!splash) return;
      var observador = new MutationObserver(function () {
        if (!document.querySelector('flutter-view, flt-glass-pane')) return;
        observador.disconnect();
        splash.classList.add('done');
        setTimeout(function () { splash.remove(); }, 400);
      });
      observador.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script>
    // Publicação nova sem "recarrega duas vezes".
    //
    // O service worker do Flutter baixa a versão nova em segundo plano e
    // assume o controle depois — então o load em que a atualização chega
    // ainda está rodando o app ANTIGO. Para quem publicou, isso se parece
    // exatamente com "a mudança não subiu": nada quebra, nada avisa, e a
    // novidade simplesmente não está lá.
    //
    // `controllerchange` dispara quando o SW novo assume. Aí recarregar é
    // barato (os arquivos já estão em cache) e a pessoa passa a ver a
    // versão nova sem saber que houve troca. A trava evita laço em
    // navegador que dispare o evento mais de uma vez.
    (function () {
      if (!('serviceWorker' in navigator)) return;

      // PRIMEIRA instalação não recarrega.
      //
      // Numa aba sem service worker (anônima, ou primeira visita), o SW é
      // registrado e assume o controle durante ESTE load — e a página já
      // está rodando a versão mais nova, porque acabou de baixá-la. Não há
      // nada para atualizar, e recarregar aqui atropela o que estiver em
      // curso: foi assim que o retorno do login Google (que volta com
      // ?code=... na URL) virava um chute de volta para a tela de login,
      // certinho na primeira tentativa e nunca na segunda.
      //
      // Só interessa o caso em que JÁ havia um controlador e ele foi
      // trocado — aí sim a aba está com a versão velha e o reload é o que
      // entrega a nova.
      var tinhaControlador = !!navigator.serviceWorker.controller;
      var recarregou = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (recarregou || !tinhaControlador) return;

        // Cinto e suspensório: nunca recarregar em cima de um retorno de
        // login social. O token vem na URL e só vale uma vez — perdê-lo
        // custa a sessão, e a atualização pode esperar a próxima abertura.
        var url = window.location;
        if (url.search.indexOf('code=') !== -1 ||
            url.hash.indexOf('access_token') !== -1 ||
            url.hash.indexOf('error=') !== -1) {
          return;
        }

        recarregou = true;
        url.reload();
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
