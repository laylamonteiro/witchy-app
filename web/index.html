<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Grimório de Bolso: agenda mágica, diário de bruxaria, calendário lunar, astrologia e companheiro de jornada para bruxas e bruxos.">
  <meta name="theme-color" content="#0B0A16">

  <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, Facebook, X...).
       A imagem precisa de URL ABSOLUTA: os apps de mensagem buscam o arquivo
       do lado deles, sem contexto da página. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Grimório de Bolso">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Grimório de Bolso">
  <meta property="og:description" content="Agenda mágica, diário de bruxaria, calendário lunar, astrologia e enciclopédia — a sua prática no bolso, no celular ou no navegador.">
  <meta property="og:url" content="https://grimoriodebolso.app/">
  <meta property="og:image" content="https://grimoriodebolso.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1129">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Grimório de Bolso — agenda mágica, calendário lunar, grimório digital e astrologia">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Grimório de Bolso">
  <meta name="twitter:description" content="Agenda mágica, diário de bruxaria, calendário lunar, astrologia e enciclopédia — a sua prática no bolso, no celular ou no navegador.">
  <meta name="twitter:image" content="https://grimoriodebolso.app/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Grimório de Bolso">
  <!-- O iOS não respeita transparência: o ícone redondo virava um círculo
       com cantos pretos na tela de início. Este tem fundo opaco. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Grimório de Bolso</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services: a entrada com o Google acontece DENTRO desta
       página, sem redirecionar para accounts.google.com. Sem isso, a página
       do Google fica no histórico da aba e o voltar acaba lá. `async` para
       não atrasar o primeiro desenho: quem usa confere se já carregou. -->
  <script src="https://accounts.google.com/gsi/client" async></script>

  <!-- Cropper.js: o recorte da foto na web (plugin image_cropper) usa a
       global `Cropper` desta biblioteca — sem os dois arquivos o recorte
       nem abre. Vendorizado em web/cropper/ (MIT, 41 KB) em vez de CDN,
       como todo o resto do site. -->
  <link rel="stylesheet" href="cropper/cropper.min.css">
  <script src="cropper/cropper.min.js"></script>

  <!-- HEIC/HEIF: o Chrome não decodifica o formato padrão da câmera de
       muitos Androids e de todo iPhone, então a foto escolhida da galeria
       nem aparecia. Este arquivo é só a ponte (2 KB); ele baixa o
       decodificador de verdade (1,5 MB) apenas quando uma foto HEIC
       aparece. `defer` porque nada disso é necessário para o primeiro
       desenho. -->
  <script src="heic/decodificador_heic.js" defer></script>

  <style>
    /* O fundo da página aparece em qualquer sobra; com a cor do app, some. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0B0A16;
    }
    /* A view do Flutter acompanha a altura da página (que o script abaixo
       mantém igual à área realmente visível do navegador). */
    flutter-view, flt-glass-pane {
      height: 100%;
    }

    /* Tela de carregamento: só o logo, sem texto. Aparece enquanto o app (que
       é grande) baixa e some quando ele sobe — inclusive na volta do login
       social, que recarrega a página inteira. A pulsação suave evita a
       sensação de tela travada durante o download.

       NOTA: este arquivo é o APP, servido na raiz. A apresentação em HTML
       estático — com nome, propósito e links legais, que um rastreador
       consegue ler — fica em /sobre/ (site/sobre/index.html). Por isso aqui
       pode ser só o logo. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0A16;
      transition: opacity .35s ease;
    }
    #boot-splash.done { opacity: 0; pointer-events: none; }
    #boot-splash img {
      width: 128px;
      height: 128px;
      animation: boot-pulse 1.8s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { opacity: .55; transform: scale(.97); }
      50%      { opacity: 1;   transform: scale(1); }
    }
    /* Quem prefere menos movimento vê o logo estático. */
    @media (prefers-reduced-motion: reduce) {
      #boot-splash img { animation: none; opacity: 1; }
    }
  </style>

  <script>
    // SERVICE WORKER PRÓPRIO (sw.js): é o que faz o app abrir sem rede.
    //
    // O Flutter 3.35 descontinuou o service worker que ele gerava e o 3.47
    // escreve um stub que se DESREGISTRA ao ativar — sem nada no lugar, o
    // app web não tinha cache nenhum e, sem internet, mostrava a página de
    // erro do navegador para uma pessoa logada com todos os dados no SQLite
    // local. O sw.js é gerado por scripts/gerar_service_worker.mjs a partir
    // do build (o build precisa de --pwa-strategy=none, para o stub sair
    // vazio, e de --no-web-resources-cdn, para o CanvasKit vir da própria
    // origem e caber no cache). Registrado cedo, e a promessa é ignorada de
    // propósito: sem service worker o app funciona igual — só não offline —,
    // e nada aqui pode segurar o boot.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      try {
        // A lista de recursos carregados (usada no aquecimento, abaixo) tem
        // um teto padrão de 250 entradas; o app passa disso com as imagens
        // do Seu Dia, e o CanvasKit e as fontes precisam caber nela.
        if (window.performance && performance.setResourceTimingBufferSize) {
          performance.setResourceTimingBufferSize(1000);
        }
        navigator.serviceWorker.register('sw.js').catch(function () {});
      } catch (e) {
        // Sem offline nesta aba; o resto segue.
      }
    })();
  </script>

  <script>
    // TECLADO DO CELULAR: o canvas do Flutter não volta ao tamanho quando o
    // teclado fecha, deixando uma faixa vazia no fim da página. A meta tag
    // `interactive-widget` sozinha não resolveu, então aqui a altura da página
    // passa a acompanhar a área visível de fato (visualViewport), que encolhe
    // quando o teclado abre e volta quando ele fecha. O Flutter observa o
    // tamanho do host e refaz o layout junto.
    (function () {
      var viewport = window.visualViewport;
      if (!viewport) return;

      var applyHeight = function () {
        var height = Math.round(viewport.height) + 'px';
        document.documentElement.style.height = height;
        document.body.style.height = height;
      };

      viewport.addEventListener('resize', applyHeight);
      window.addEventListener('orientationchange', function () {
        // A rotação só reporta o tamanho novo no quadro seguinte.
        setTimeout(applyHeight, 150);
      });
      applyHeight();
    })();
  </script>

  <script>
    // VOLTAR DEPOIS DO LOGIN SOCIAL: quando a entrada com o Google cai no
    // redirecionamento, o histórico da aba guarda o documento de ANTES do
    // login — o app congelado na tela de entrada. O voltar restaura esse
    // documento do bfcache exatamente como ele estava: a pessoa vê a tela
    // de login e conclui que foi deslogada. Não foi — o avançar "devolve"
    // a conta, mas ninguém aperta avançar. E nenhum guarda DENTRO do app
    // (PopScope, GuestOnly) alcança isso, porque o documento restaurado é
    // outra instância do app, com o estado de antes do login.
    //
    // A saída é recarregar sempre que a página voltar do bfcache: o boot
    // relê a sessão do localStorage — que é compartilhado entre os
    // documentos e continua viva — e escolhe a tela pelo estado REAL.
    // Com sessão, Home; sem, entrada. Restauro de bfcache só acontece ao
    // navegar ENTRE documentos (login social, link externo), então isto
    // não toca a navegação normal dentro do app, que é de documento único.
    window.addEventListener('pageshow', function (e) {
      // Recarga NOSSA: libera a guarda de saída antes, senão o conserto do
      // bfcache viraria um diálogo "Sair do site?" na cara dela.
      if (e.persisted) {
        window.__gdbSaidaAutorizada = true;
        window.location.reload();
      }
    });
  </script>
</head>
<body>
  <!--
    NÃO registrar o sqflite_sw.js como service worker aqui. O pacote
    sqflite_common_ffi_web instancia esse arquivo como SharedWorker por
    conta própria (dentro de databaseFactoryFfiWeb) — registrá-lo como
    service worker fazia o SW interceptar o fetch do sqlite3.wasm e
    devolver vazio, estourando "unsupported result null" no boot a partir
    do segundo load, além de tomar o lugar do sw.js (o service worker do
    app, registrado no <head>).
  -->
  <div id="boot-splash">
    <img src="/icons/Icon-512.png" alt="Grimório de Bolso">
  </div>

  <script>
    // Tira a tela de carregamento assim que o Flutter monta a própria view.
    // Sem tempo-limite de propósito: se o app não subir, é melhor a pessoa
    // continuar vendo o nome e os links do que uma tela vazia.
    (function () {
      var splash = document.getElementById('boot-splash');
      if (!splash) return;
      var observador = new MutationObserver(function () {
        if (!document.querySelector('flutter-view, flt-glass-pane')) return;
        observador.disconnect();
        splash.classList.add('done');
        setTimeout(function () { splash.remove(); }, 400);
        // A casca subiu: hora de aquecer o cache do service worker (abaixo).
        // Agora, e de novo em ~15 s — as fontes do Google e as imagens do
        // Seu Dia chegam depois da montagem. Depois disso, o resto do build.
        aquecerCache();
        setTimeout(aquecerCache, 15000);
        setTimeout(completarCacheOffline, 20000);
      });
      observador.observe(document.body, { childList: true, subtree: true });
    })();

    // AQUECIMENTO DO CACHE OFFLINE.
    //
    // Na PRIMEIRA visita o service worker ainda está instalando quando a
    // página baixa o CanvasKit (~7 MB), o sqlite3.wasm e as fontes — esses
    // pedidos não passam por ele e não entram no cache. Sem isto, a segunda
    // visita sem rede abriria a casca e ficaria sem renderizador. A página
    // sabe o que baixou (performance.getEntriesByType('resource')) e manda a
    // lista para o SW, que guarda o que é dele e ignora o resto. Tudo em
    // try/catch: aquecer é um bônus, e um bônus nunca pode quebrar o boot.
    function aquecerCache() {
      try {
        if (!('serviceWorker' in navigator)) return;
        if (!window.performance || !performance.getEntriesByType) return;
        var urls = performance.getEntriesByType('resource').map(function (e) {
          return e.name;
        });
        var mensagem = { tipo: 'aquecer', urls: urls };
        var controlador = navigator.serviceWorker.controller;
        if (controlador) {
          controlador.postMessage(mensagem);
          return;
        }
        // Primeira visita: o SW ainda não controla esta aba. `ready` resolve
        // quando ele ativa; aí o `active` recebe a mensagem.
        navigator.serviceWorker.ready.then(function (reg) {
          if (reg && reg.active) reg.active.postMessage(mensagem);
        }).catch(function () {});
      } catch (e) {
        // Sem aquecimento nesta abertura; o cache preguiçoso cobre depois.
      }
    }

    // COMPLETAR O CACHE OFFLINE: o resto do build, em segundo plano.
    //
    // O aquecimento acima só guarda o que a página JÁ baixou, e o cache do
    // service worker só guarda o que a pessoa VISITOU. Quem abriu o app,
    // ficou no Seu Dia e perdeu a rede depois encontrava o Conselheiro sem a
    // bola de cristal e a erva sem foto: o app abria, mas pela metade — um
    // defeito que parece aleatório para quem usa, porque depende de por onde
    // ela andou. Aqui o SW puxa o restante (as imagens, os ícones, as cartas
    // — sem as variantes de CanvasKit que este navegador não usa), uma
    // requisição por vez.
    //
    // Vinte segundos depois da casca subir, de propósito: primeiro a pessoa
    // usa o app, depois a gente completa o cache. E NUNCA contra a vontade do
    // aparelho: com a economia de dados ligada, ou numa rede que o navegador
    // classifica como lenta, não puxamos nada — quem está contando megabyte
    // não pediu um download de fundo.
    function completarCacheOffline() {
      try {
        if (!('serviceWorker' in navigator)) return;
        var conexao = navigator.connection;
        if (conexao) {
          if (conexao.saveData) return;
          var tipo = conexao.effectiveType || '';
          if (tipo === 'slow-2g' || tipo === '2g') return;
        }
        var mensagem = { tipo: 'aquecer-tudo' };
        var controlador = navigator.serviceWorker.controller;
        if (controlador) {
          controlador.postMessage(mensagem);
          return;
        }
        navigator.serviceWorker.ready.then(function (reg) {
          if (reg && reg.active) reg.active.postMessage(mensagem);
        }).catch(function () {});
      } catch (e) {
        // O cache preguiçoso continua valendo; só não adiantamos o trabalho.
      }
    }
  </script>

  <script>
    // Publicação nova sem "recarrega duas vezes".
    //
    // O nosso service worker (sw.js, registrado no <head>) baixa a versão
    // nova em segundo plano — o navegador vê que os bytes do sw.js mudaram,
    // instala o novo, e ele faz skipWaiting + clients.claim — então o load
    // em que a atualização chega ainda está rodando o app ANTIGO, servido do
    // cache da versão anterior. Para quem publicou, isso se parece
    // exatamente com "a mudança não subiu": nada quebra, nada avisa, e a
    // novidade simplesmente não está lá.
    //
    // `controllerchange` dispara quando o SW novo assume. Aí recarregar é
    // barato (os arquivos já estão em cache) e a pessoa passa a ver a
    // versão nova sem saber que houve troca. A trava evita laço em
    // navegador que dispare o evento mais de uma vez. (Era assim com o
    // service worker antigo do Flutter, que a 3.47 desregistra; o nosso
    // segue o mesmo contrato, e esta lógica vale igual.)
    (function () {
      if (!('serviceWorker' in navigator)) return;

      // PRIMEIRA instalação não recarrega.
      //
      // Numa aba sem service worker (anônima, ou primeira visita), o SW é
      // registrado e assume o controle durante ESTE load — e a página já
      // está rodando a versão mais nova, porque acabou de baixá-la. Não há
      // nada para atualizar, e recarregar aqui atropela o que estiver em
      // curso: foi assim que o retorno do login Google (que volta com
      // ?code=... na URL) virava um chute de volta para a tela de login,
      // certinho na primeira tentativa e nunca na segunda.
      //
      // Só interessa o caso em que JÁ havia um controlador e ele foi
      // trocado — aí sim a aba está com a versão velha e o reload é o que
      // entrega a nova.
      var tinhaControlador = !!navigator.serviceWorker.controller;
      var recarregou = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (recarregou || !tinhaControlador) return;

        // Cinto e suspensório: nunca recarregar em cima de um retorno de
        // login social. O token vem na URL e só vale uma vez — perdê-lo
        // custa a sessão, e a atualização pode esperar a próxima abertura.
        var url = window.location;
        if (url.search.indexOf('code=') !== -1 ||
            url.hash.indexOf('access_token') !== -1 ||
            url.hash.indexOf('error=') !== -1) {
          return;
        }

        recarregou = true;
        // Idem: a troca de service worker é decisão do app, não da pessoa.
        window.__gdbSaidaAutorizada = true;
        url.reload();
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
