<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    interactive-widget=resizes-content: quando o teclado do celular abre, o
    navegador redimensiona o CONTEÚDO (e não só a área visível). Sem isso, ao
    fechar o teclado o canvas do Flutter não voltava ao tamanho e sobrava uma
    faixa no fim da página. viewport-fit=cover cobre o notch/barra do sistema.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Grimório de Bolso: agenda mágica, diário de bruxaria, calendário lunar, astrologia e companheiro de jornada para bruxas e bruxos.">
  <meta name="theme-color" content="#0B0A16">

  <style>
    /* O fundo da página aparece em qualquer sobra (teclado abrindo/fechando,
       barra do navegador entrando/saindo). Sem isto ele é branco e salta aos
       olhos; com a cor do app, some. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0B0A16;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Grimório de Bolso">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Grimório de Bolso</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    NÃO registrar o sqflite_sw.js como service worker aqui. O pacote
    sqflite_common_ffi_web instancia esse arquivo como SharedWorker por
    conta própria (dentro de databaseFactoryFfiWeb) — registrá-lo como
    service worker fazia o SW interceptar o fetch do sqlite3.wasm e
    devolver vazio, estourando "unsupported result null" no boot a partir
    do segundo load, além de sobrescrever o flutter_service_worker.js do PWA.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
