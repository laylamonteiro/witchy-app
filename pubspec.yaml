name: grimorio_de_bolso
description: Um grimório vivo, agenda mágica e companheiro de jornada para bruxas e bruxos iniciantes
publish_to: 'none'
version: 1.0.0+36

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  flutter_image_compress: ^2.0.4
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.2

  # Lunar calculations
  lunar: ^1.7.8

  # Local notifications
  # flutter_local_notifications: ^19.5.0 # Removido para re-adicionar
  timezone: ^0.10.1

  # Drawing (for sigils)
  flutter_drawing_board: ^0.9.8

  # For web support of sqflite
  sqflite_common_ffi_web: ^1.1.0

  # Astrology calculations
  # Pinned to a Dart 3.0-compatible release so `flutter pub get` works on the
  # GitHub Actions runner (Dart 3.4.0).
  sweph: ^3.2.1+2.10.3

  # Location & Geocoding
  geocoding: ^4.0.0
  geolocator: ^14.0.2

  # HTTP client for AI API calls
  dio: ^5.4.0

  # Secure storage for API keys
  flutter_secure_storage: ^9.0.0

  # Crypto utilities
  crypto: ^3.0.3


  # Markdown rendering
  flutter_markdown: ^0.7.7+1

  # Image picker for profile photos
  image_picker: ^1.0.7
  image_cropper: ^11.0.0

  # Backend Authentication (Supabase)
  supabase_flutter: ^2.3.0

  # Login social
  # google_sign_in: any # Removido para re-adicionar
  # firebase_auth: any # Removido para re-adicionar

  # In-App Purchases (RevenueCat)
  # purchases_flutter: ^9.9.10 # Removido para re-adicionar
  # purchases_ui_flutter: ^9.9.10 # Removido para re-adicionar

  # Login social
  firebase_auth: ^6.1.2
  google_sign_in: ^6.1.0

  # In-App Purchases (RevenueCat)
  purchases_flutter: ^9.9.10
  purchases_ui_flutter: ^9.9.10

  # Local notifications
  flutter_local_notifications: ^19.5.0

  # App Info & Utils
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Dependency overrides para resolver problemas de build
dependency_overrides:
  # Força versão específica do sqlite3 para evitar hash mismatch
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/crystals/
    - assets/images/herbs/
    - assets/images/deusas/
    - assets/images/metais/
    - assets/icons/
    - assets/ephe/

# Configuração do ícone do app
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0B0A16"  # Cor de fundo do tema
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true
