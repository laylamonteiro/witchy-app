<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório de Bolso — Informações Legais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            line-height: 1.7;
            color: #d8d2e0;
            background:
                radial-gradient(ellipse at 20% -10%, rgba(155, 109, 198, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(240, 199, 94, 0.07) 0%, transparent 45%),
                linear-gradient(160deg, #17111f 0%, #0d0a14 60%, #0a0810 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .container {
            max-width: 460px;
            width: 100%;
            text-align: center;
            background: rgba(30, 22, 40, 0.92);
            border: 1px solid rgba(201, 162, 232, 0.22);
            padding: 44px 32px;
            border-radius: 22px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        }

        .emoji { font-size: 2.6em; margin-bottom: 10px; }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            color: #c9a2e8;
            font-size: 1.6em;
            margin-bottom: 6px;
        }

        .tagline { color: #8d84a0; margin-bottom: 30px; }

        .links { display: flex; flex-direction: column; gap: 12px; }

        .link-button {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(155, 109, 198, 0.12);
            border: 1px solid rgba(201, 162, 232, 0.35);
            color: #efe9f6;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 500;
            transition: all .15s ease;
        }

        .link-button:hover {
            background: rgba(155, 109, 198, 0.25);
            border-color: #c9a2e8;
            transform: translateY(-1px);
        }

        .link-button .icon { font-size: 1.25em; }

        .store-badges { margin-top: 28px; }
        .badge { height: 56px; opacity: .85; transition: opacity .15s; }
        .badge:hover { opacity: 1; }

        .footer {
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid rgba(201, 162, 232, 0.18);
            color: #8d84a0;
            font-size: 0.86em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🌙✨📖</div>
        <h1>Grimório de Bolso</h1>
        <p class="tagline">Sua jornada mágica começa aqui</p>

        <div class="links">
            <a href="privacy-policy.html" class="link-button">
                <span class="icon">🔒</span>
                <span>Política de Privacidade</span>
            </a>

            <a href="data-deletion.html" class="link-button">
                <span class="icon">🗑️</span>
                <span>Exclusão de Dados</span>
            </a>

            <a href="mailto:suporte.grimoriodebolso@gmail.com" class="link-button">
                <span class="icon">📧</span>
                <span>Contato de Suporte</span>
            </a>
        </div>

        <div class="store-badges">
            <!-- Substitua # pelo link real quando o app estiver publicado -->
            <a href="#" target="_blank" rel="noopener">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Disponível no Google Play" class="badge">
            </a>
        </div>

        <div class="footer">
            <p>Grimório de Bolso © 2026 &bull; Feito com magia e código 🌙✨</p>
        </div>
    </div>
</body>
</html>
