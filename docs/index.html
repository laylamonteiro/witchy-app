<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório de Bolso - Informações Legais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(118, 75, 162, 0.4);
        }

        .link-button .icon {
            font-size: 1.5em;
        }

        .store-badges {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .badge {
            height: 50px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .badge:hover {
            opacity: 1;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9em;
        }

        .footer a {
            color: #764ba2;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🌙✨📖</div>
        <h1>Grimório de Bolso</h1>
        <p>Seu companheiro de jornada mágica</p>

        <div class="links">
            <a href="privacy-policy.html" class="link-button">
                <span class="icon">🔒</span>
                <span>Política de Privacidade</span>
            </a>

            <a href="data-deletion.html" class="link-button">
                <span class="icon">🗑️</span>
                <span>Exclusão de Dados</span>
            </a>

            <a href="mailto:suporte.grimoriodebolso@gmail.com" class="link-button">
                <span class="icon">📧</span>
                <span>Contato de Privacidade</span>
            </a>
        </div>

        <div class="store-badges">
            <!-- Substitua # pelos links reais quando o app estiver publicado -->
            <a href="#" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" class="badge">
            </a>
            <!--
            <a href="#" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on App Store" class="badge">
            </a>
            -->
        </div>

        <div class="footer">
            <p>Grimório de Bolso © 2025</p>
            <p>Desenvolvido por <a href="https://github.com/laylamonteiro" target="_blank">@laylamonteiro</a></p>
            <p>Feito com magia e código 🌙✨</p>
        </div>
    </div>
</body>
</html>
