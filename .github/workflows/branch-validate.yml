name: ✅ Branch Validation

# Gate de qualidade + prévia do site. NUNCA toca produção.
#
#   branch de trabalho → gate (required check) + prévia própria do site + PR draft para a main
#   main               → staging do site + PR "🚢 Publicar" (main → release).
#                        O gate da main é o dry-run do release.yml, no mesmo push.
#   Run workflow       → também gera um APK candidato assinado de qualquer branch.
#
# Sem paths-ignore: o `validate` é required check e precisa rodar em todo PR,
# senão um PR só de docs ficaria travado esperando um check que nunca vem.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: branch-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Nome usado pela branch protection — não renomear.
    name: 🔍 Analyze, Test & Build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      android_mudou: ${{ steps.android.outputs.mudou }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🔎 Mudou android/ ou pubspec?
        id: android
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1 || \
             git diff --name-only HEAD^ HEAD | grep -qE '^(android/|pubspec\.(yaml|lock))'; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/credenciais-app
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/gate

  # Fumaça de Gradle/NDK/manifest, fora do gate para não segurar a prévia.
  # No dispatch o apk-candidato já prova a mesma camada.
  build-android-debug:
    name: 🤖 Build Android (fumaça)
    needs: validate
    if: needs.validate.outputs.android_mudou == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 🧹 Liberar disco do runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: ./.github/actions/credenciais-app
      - uses: ./.github/actions/setup-flutter
      - name: 📱 Build debug APK
        run: flutter build apk --debug

  # main → alias fixo `staging`; outras branches → prévia com o próprio nome.
  # Este workflow nunca passa --branch=main, então produção é inalcançável.
  deploy-web:
    name: 🌐 Publicar prévia do site
    needs: validate
    # Na main o validate é pulado (skipped); numa branch, gate vermelho não publica.
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: a versão da prévia deriva da última release
          persist-credentials: false

      - name: 🔢 Versão e alias
        id: alvo
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          NOME="${TAG#v}"; NOME="${NOME%%+*}"; NOME="${NOME:-0.0.0}"
          echo "nome=${NOME}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$REF_NAME" = "main" ]; then
            echo "alias=staging" >> "$GITHUB_OUTPUT"
          else
            echo "alias=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔎 Secrets e Production branch do Cloudflare
        # Se o painel deixar de apontar produção para `main`, o alias staging
        # poderia virar produção — por isso divergência é erro.
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ausentes."
            exit 1
          fi
          atual=$(curl -sS --retry 2 -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/grimorio-de-bolso" \
            | jq -r '.result.production_branch // empty' || true)
          if [ -z "$atual" ]; then
            echo "::warning::Não foi possível ler a Production branch do projeto."
          elif [ "$atual" != "main" ]; then
            echo "::error::A Production branch do Cloudflare é '$atual', não 'main' — ajuste em Workers & Pages → grimorio-de-bolso → Settings antes de qualquer deploy."
            exit 1
          fi

      - uses: ./.github/actions/credenciais-app

      - uses: ./.github/actions/setup-flutter
        with:
          com-java: 'false'

      - uses: ./.github/actions/build-web
        with:
          ambiente: previa
          build-name: ${{ steps.alvo.outputs.nome }}
          supabase-url: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          turnstile-site-key: ${{ secrets.TURNSTILE_SITE_KEY }}
          # Sem fallback para a chave real: prévia nunca cobra.
          revenuecat-web-key: ${{ secrets.REVENUECAT_WEB_KEY_SANDBOX }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: 🚀 Deploy para o Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=grimorio-de-bolso --branch=${{ steps.alvo.outputs.alias }} --commit-dirty=true

      - name: 🔗 Endereço publicado
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            if [ "$BRANCH" = "main" ]; then
              echo "## 🧪 Staging atualizado — grimoriodebolso.app NÃO mudou"
            else
              echo "## 🔍 Prévia do branch \`$BRANCH\`"
            fi
            echo
            if [ -n "$ALIAS" ]; then echo "- Alias: <$ALIAS>"; fi
            if [ -n "$URL" ]; then echo "- Esta publicação: <$URL>"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # APK de release assinado de qualquer branch (só pelo botão Run workflow).
  # Na main, o dry-run do release.yml já entrega APK/AAB assinados.
  apk-candidato:
    name: 📱 APK candidato (assinado)
    needs: validate
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: a versão do candidato deriva da última release
          persist-credentials: false

      - name: 🔢 Versão do candidato
        id: versao
        run: |
          TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          NOME="${TAG#v}"; NOME="${NOME%%+*}"; NOME="${NOME:-0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$NOME"
          echo "nome=${NOME}-rc.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "codigo=$((MAJOR * 100000 + MINOR * 1000 + PATCH * 10))" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/credenciais-app
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - uses: ./.github/actions/setup-flutter

      - name: 📱 Build APK candidato
        id: build
        uses: ./.github/actions/build-android
        with:
          formato: apk
          previa: 'true'
          build-name: ${{ steps.versao.outputs.nome }}
          build-number: ${{ steps.versao.outputs.codigo }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          store-password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          keystore-type: ${{ secrets.ANDROID_KEYSTORE_TYPE || 'JKS' }}
          supabase-url: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          revenuecat-android-key: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          revenuecat-ios-key: ${{ secrets.REVENUECAT_IOS_KEY }}
          admin-email: ${{ secrets.ADMIN_EMAIL }}
          admin-password: ${{ secrets.ADMIN_PASSWORD }}
          admob-android-interstitial-id: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          turnstile-site-key: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: 📦 Renomear
        env:
          ARQUIVO: ${{ steps.build.outputs.arquivo }}
          NOME: ${{ steps.versao.outputs.nome }}
        run: |
          mkdir -p candidato
          cp "$ARQUIVO" "candidato/grimorio-de-bolso-${NOME}.apk"

      - name: 📤 Upload do candidato
        uses: actions/upload-artifact@v4
        with:
          name: apk-candidato-${{ steps.versao.outputs.nome }}
          path: candidato/*.apk
          retention-days: 14

  # Toda branch de trabalho ganha um PR draft para a main depois do gate verde.
  abrir-pr:
    name: 🔀 Abrir PR para a main
    needs: validate
    if: >-
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/release' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔀 Abrir se ainda não existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existente=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existente" ]; then
            echo "PR #$existente já aberto — nada a fazer."
            exit 0
          fi
          git fetch origin main --quiet
          if [ -z "$(git log --oneline origin/main..HEAD)" ]; then
            echo "Nenhum commit além da main."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --draft \
            --title "$(git log -1 --pretty=%s)" \
            --body "$(printf '%s\n\n%s\n' \
              "Aberto pelo CI depois do gate verde em \`$BRANCH\`." \
              "$(git log --pretty='- %s' origin/main..HEAD)")"

  # PR de publicação main → release: o diff é exatamente o que ainda não chegou
  # às usuárias. Mergear dispara o release.yml.
  pr-release:
    name: 🚢 PR de publicação (main → release)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # criar o branch `release` na primeira vez
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚢 Abrir ou atualizar o PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin

          if ! git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            base=$(git tag -l 'v*' | sort -V | tail -1)
            base=${base:-$(git rev-list --max-parents=0 HEAD | tail -1)}
            git push origin "$base:refs/heads/release"
            git fetch origin release --quiet
          fi

          pendentes=$(git log --oneline origin/release..origin/main | wc -l | tr -d ' ')
          if [ "$pendentes" = "0" ]; then
            echo "Nada por publicar."
            exit 0
          fi

          ULTIMA=$(git tag -l 'v*' | sed -e 's/^v//' -e 's/+.*//' | sort -V | tail -1)
          ULTIMA=${ULTIMA:-0.0.0}
          PROXIMA=$(echo "$ULTIMA" | awk -F. '{print $1"."$2"."$3+1}')

          titulo="🚢 Publicar v$PROXIMA ($pendentes commit(s))"
          corpo=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Mergear este PR envia o AAB **v$PROXIMA** à faixa de teste da Play (automático) e deixa a GitHub Release em rascunho. O site em grimoriodebolso.app só muda quando você aprovar o environment \`production\`, depois de testar." \
            "Última publicada: v$ULTIMA. Para minor/major, use o botão *Run workflow* do Release com a versão, em vez de mergear." \
            "### O que entra" \
            "$(git log --pretty='- %s' origin/release..origin/main)")

          existente=$(gh pr list --base release --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existente" ]; then
            gh pr edit "$existente" --title "$titulo" --body "$corpo"
          else
            gh pr create --base release --head main --title "$titulo" --body "$corpo"
          fi
