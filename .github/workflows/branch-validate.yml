name: ✅ Branch Validation

# Validação bloqueante para branches de trabalho (analyze + test + build debug).
# Diferente do release (push em main), aqui análise e testes FALHAM o job —
# é o gate de qualidade usado durante o desenvolvimento.

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  validate:
    name: 🔍 Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧹 Free runner disk space
        # O build debug do APK esgota o disco do runner (Gradle/NDK/SDK).
        # Mesma mitigação do workflow de release.
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🔐 Create credential stubs (analyze/test não usam APIs reais)
        run: |
          cat > lib/core/ai/groq_credentials.dart << 'CREDENTIALS'
          /// Credentials for the Groq API.
          ///
          class GroqCredentials {
            static const apiKey = '';
          }
          CREDENTIALS
          cat > lib/features/astrology/data/services/prokerala_credentials.dart << 'CREDENTIALS'
          /// Credentials for the Prokerala API.
          ///
          class ProkeralaCredentials {
            static const String clientId = '';
            static const String clientSecret = '';
          }
          CREDENTIALS

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🌐 Generate localizations
        run: flutter gen-l10n

      - name: 🔍 Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: 🧭 Analyze (bloqueante em erros/warnings)
        # --no-fatal-infos: falha só em erros e warnings (problemas reais
        # introduzidos), não na dívida de lint info pré-existente
        # (withOpacity depreciado, prefer_const etc.).
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Testes de i18n/conteúdo (bloqueante)
        # Paridade pt/en/es da camada de conteúdo + localização de feitiços:
        # é o núcleo verificável do trabalho de i18n e NÃO pode regredir.
        run: |
          flutter test \
            test/content_parity_test.dart \
            test/trails_parity_test.dart \
            test/dream_themes_parity_test.dart \
            test/astrology_interpretations_parity_test.dart \
            test/daily_weather_content_parity_test.dart \
            test/spell_localization_test.dart \
            test/app_deep_link_test.dart \
            test/numerology_meanings_parity_test.dart \
            test/content_models_parity_test.dart \
            test/moon_sun_content_parity_test.dart \
            test/guided_rituals_parity_test.dart \
            test/tarot_concept_questions_parity_test.dart \
            test/ai_prompts_parity_test.dart \
            test/l10n_test.dart \
            test/numerology_calculator_test.dart \
            test/i18n_smoke_test.dart

      - name: 🧪 Suíte completa (informativo)
        # Não-bloqueante: alguns widget tests legados falham por dívida
        # pré-existente na main (ex.: gender fallback, limites de FeatureAccess)
        # ou por pumparem telas localizadas sem delegates — rastreado para a
        # auditoria técnica (Etapa 3), fora do escopo do gate de i18n.
        run: flutter test
        continue-on-error: true

      - name: 🔤 ARB key parity
        run: bash scripts/check_arb_sync.sh

      - name: 🔎 Hardcoded PT scan (bloqueante — gate final da i18n)
        run: bash scripts/check_hardcoded_pt.sh

      - name: 📱 Build debug APK
        run: flutter build apk --debug
