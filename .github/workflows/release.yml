name: 🚀 Release

# Publicar é DECISÃO, nunca efeito colateral de merge. Tudo sai do MESMO commit:
#
#   push na main     → dry-run: gate + AAB/APK assinados + web de produção, sem publicar
#   push na release  → (merge do PR "🚢 Publicar") versão = última tag + 1 no patch
#   Run workflow     → versão escolhida (minor/major) ou dry-run (somente_validar)
#
# Ao publicar, em dois tempos:
#   1. play-interno (automático): AAB na faixa de teste (PLAY_TRACK) → tag vX.Y.Z
#      → GitHub Release em RASCUNHO. Só testers veem.
#   2. producao-web (aprovação do environment `production`): site em
#      grimoriodebolso.app → Release publicada.
#   A promoção na Play (teste → produção) continua manual, na Play Console.
#
# Versão: versionName = X.Y.Z; versionCode = M*100000 + m*1000 + p*10.
# Determinístico, sem commit de bot. Piso legado: 126 (tags vX.Y.Z+N).

on:
  push:
    branches: [release, main]
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar (ex.: 2.1.0). Publicar só é aceito a partir da main.'
        required: true
        type: string
      somente_validar:
        description: 'Dry-run: valida e builda tudo, não publica nada nem cria tag'
        required: false
        type: boolean
        default: false
      faixa:
        description: 'Faixa da Play só para esta execução (vazio = variável PLAY_TRACK)'
        required: false
        type: string
        default: ''

# Publicações: uma por vez e nunca canceladas no meio. Dry-runs da main têm
# grupo próprio (não ficam presos atrás de um release esperando aprovação) e
# o push mais novo cancela o anterior.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'release-dry-run' || 'release' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # Falha em segundos, antes de qualquer build: versão, faixa e secrets.
  preparar:
    name: 🔢 Versão e guardas
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.versao.outputs.nome }}
      version_code: ${{ steps.versao.outputs.codigo }}
      sha: ${{ steps.versao.outputs.sha }}
      faixa: ${{ steps.faixa.outputs.nome }}
      dry_run: ${{ steps.versao.outputs.dry }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔢 Resolver e validar a versão
        id: versao
        env:
          EVENTO: ${{ github.event_name }}
          INPUT_VERSAO: ${{ inputs.versao }}
          SOMENTE_VALIDAR: ${{ inputs.somente_validar }}
        run: |
          git fetch --tags --quiet
          ultima_tag() { git tag -l 'v*' | sed -e 's/^v//' -e 's/+.*//' | sort -V | tail -1; }

          if [ "$EVENTO" = "workflow_dispatch" ]; then
            NOME="${INPUT_VERSAO#v}"
          else
            ULTIMA=$(ultima_tag); ULTIMA=${ULTIMA:-0.0.0}
            NOME=$(echo "$ULTIMA" | awk -F. '{print $1"."$2"."$3+1}')
            echo "Versão a partir de $GITHUB_REF_NAME: $ULTIMA → $NOME"
          fi

          # A main nunca publica; o botão publica só com somente_validar desligado.
          if [ "$EVENTO" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            DRY=true
          elif [ "$SOMENTE_VALIDAR" = "true" ]; then
            DRY=true
          else
            DRY=false
          fi

          # Publicar pelo botão só a partir da main: impede levar à Play/site o
          # código de uma branch que nunca passou por PR.
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$DRY" = "false" ] && \
             [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Publicar pelo botão só a partir da main (você rodou em '$GITHUB_REF_NAME'). Para testar esta branch, marque somente_validar."
            exit 1
          fi

          if ! echo "$NOME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão inválida: '$NOME'. Use X.Y.Z (ex.: 2.1.0)."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$NOME"
          CODIGO=$((MAJOR * 100000 + MINOR * 1000 + PATCH * 10))

          MAIOR=$(ultima_tag)
          if [ -n "$MAIOR" ]; then
            TOPO=$(printf '%s\n%s\n' "$MAIOR" "$NOME" | sort -V | tail -1)
            if [ "$TOPO" != "$NOME" ] || [ "$MAIOR" = "$NOME" ]; then
              echo "::error::A versão $NOME não é maior que a última publicada ($MAIOR)."
              exit 1
            fi
          fi

          LEGADO=$(git tag -l 'v*+*' | sed 's/.*+//' | sort -n | tail -1)
          LEGADO=${LEGADO:-126}
          if [ "$CODIGO" -le "$LEGADO" ]; then
            echo "::error::versionCode $CODIGO não supera o legado ($LEGADO)."
            exit 1
          fi

          {
            echo "nome=$NOME"
            echo "codigo=$CODIGO"
            echo "sha=$GITHUB_SHA"
            echo "dry=$DRY"
          } >> "$GITHUB_OUTPUT"
          echo "✅ $NOME (versionCode $CODIGO) de $GITHUB_SHA — dry-run: $DRY"

      - name: 🎯 Resolver a faixa da Play
        # Variável de repositório PLAY_TRACK (sem commit para trocar). O
        # identificador é o da URL da Play Console (.../tracks/<nome>).
        id: faixa
        env:
          INPUT_FAIXA: ${{ inputs.faixa }}
          VAR_FAIXA: ${{ vars.PLAY_TRACK }}
        run: |
          FAIXA="${INPUT_FAIXA:-$VAR_FAIXA}"
          if [ -z "$FAIXA" ]; then
            echo "::warning::PLAY_TRACK vazio — usando 'internal'. Confira Settings → Secrets and variables → Actions → Variables."
            FAIXA="internal"
          fi
          case "$FAIXA" in
            *[[:space:]]*)
              echo "::error::Faixa '$FAIXA' tem espaço ou quebra de linha."
              exit 1 ;;
            production)
              echo "::error::Produção não passa por aqui — a promoção é manual, na Play Console."
              exit 1 ;;
          esac
          echo "nome=$FAIXA" >> "$GITHUB_OUTPUT"
          echo "✅ AAB irá para a faixa '$FAIXA'."

      - name: 🔑 Conferir secrets obrigatórios
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ steps.versao.outputs.dry }}
        run: |
          faltando=""
          [ -z "$KEYSTORE" ] && faltando="$faltando ANDROID_KEYSTORE_BASE64"
          if [ "$DRY_RUN" != "true" ]; then
            [ -z "$CF_TOKEN" ] && faltando="$faltando CLOUDFLARE_API_TOKEN"
            [ -z "$CF_ACCOUNT" ] && faltando="$faltando CLOUDFLARE_ACCOUNT_ID"
            [ -z "$PLAY_SA" ] && faltando="$faltando PLAY_SERVICE_ACCOUNT_JSON"
          fi
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando (docs/PLAY_SERVICE_ACCOUNT.md para o da Play)."
            exit 1
          fi
          # `secrets` não existe em `if:` de step — sai como output.
          if [ -n "$PLAY_SA" ]; then
            echo "tem_play=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem_play=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔎 A faixa existe mesmo na Play?
        # Identificador errado morre aqui (~20s), não depois de 10 min de build.
        if: steps.secrets.outputs.tem_play == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ steps.faixa.outputs.nome }}
          PLAY_PACKAGE: com.grimoriodebolso.app
        run: |
          pip install --quiet --disable-pip-version-check google-auth
          python3 scripts/ci/conferir_faixa_play.py

  # Gate e builds correm em PARALELO; nada publica sem os três verdes.
  validar:
    name: 🧪 Gate de qualidade
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/credenciais-app
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/gate

  # APK e AAB em runners separados (~10 min em vez de ~20). fail-fast: false
  # para um diagnóstico não esconder o outro.
  build-android:
    name: 🤖 Build Android (${{ matrix.formato }})
    needs: preparar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        formato: [apk, aab]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/credenciais-app
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - uses: ./.github/actions/setup-flutter

      - name: 🏗️ Build assinado
        id: build
        uses: ./.github/actions/build-android
        with:
          formato: ${{ matrix.formato }}
          build-name: ${{ needs.preparar.outputs.version_name }}
          build-number: ${{ needs.preparar.outputs.version_code }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          store-password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          keystore-type: ${{ secrets.ANDROID_KEYSTORE_TYPE || 'JKS' }}
          supabase-url: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          revenuecat-android-key: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          revenuecat-ios-key: ${{ secrets.REVENUECAT_IOS_KEY }}
          admin-email: ${{ secrets.ADMIN_EMAIL }}
          admin-password: ${{ secrets.ADMIN_PASSWORD }}
          admob-android-interstitial-id: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          turnstile-site-key: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: 📦 Empacotar
        # Símbolos só do AAB (é o binário da Play; os dois colidiriam no nome).
        # APK sem login Google sai carimbado no nome.
        env:
          NOME: ${{ needs.preparar.outputs.version_name }}
          CODIGO: ${{ needs.preparar.outputs.version_code }}
          FORMATO: ${{ matrix.formato }}
          ARQUIVO: ${{ steps.build.outputs.arquivo }}
          SEM_LOGIN: ${{ steps.build.outputs.sem-login-google }}
        run: |
          mkdir -p release-files
          SUFIXO=''
          if [ "$SEM_LOGIN" = "true" ]; then SUFIXO='-SEM-LOGIN-GOOGLE'; fi
          cp "$ARQUIVO" "release-files/grimorio-de-bolso-${NOME}+${CODIGO}${SUFIXO}.${FORMATO}"
          if [ "$FORMATO" = "aab" ] && [ -d build/app/outputs/symbols ]; then
            (cd build/app/outputs/symbols && zip -qr - .) \
              > "release-files/grimorio-de-bolso-${NOME}-symbols.zip"
          fi
          ls -la release-files/

      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ matrix.formato }}
          path: release-files/*
          retention-days: 30

  build-web:
    name: 🌐 Build web (produção)
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/credenciais-app

      - uses: ./.github/actions/setup-flutter
        with:
          com-java: 'false'

      - uses: ./.github/actions/build-web
        with:
          ambiente: producao
          build-name: ${{ needs.preparar.outputs.version_name }}
          build-number: ${{ needs.preparar.outputs.version_code }}
          supabase-url: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          turnstile-site-key: ${{ secrets.TURNSTILE_SITE_KEY }}
          revenuecat-web-key: ${{ secrets.REVENUECAT_WEB_KEY }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: 📤 Upload do site
        # 30 dias: a aprovação do site pode vir bem depois do build.
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          path: public/
          retention-days: 30

  # ── Tempo 1: Play (sem aprovação — só testers veem a faixa de teste) ──
  # Exige gate, AAB e web verdes. O APK é opcional (só anexo da Release).
  play-interno:
    name: 🤖 Play (faixa de teste) + Release rascunho
    needs: [preparar, validar, build-android, build-web]
    if: >-
      always() &&
      needs.preparar.result == 'success' &&
      needs.preparar.outputs.dry_run == 'false' &&
      needs.validar.result == 'success' &&
      needs.build-web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NOME: ${{ needs.preparar.outputs.version_name }}
      CODIGO: ${{ needs.preparar.outputs.version_code }}
      SHA: ${{ needs.preparar.outputs.sha }}
      FAIXA: ${{ needs.preparar.outputs.faixa }}

    steps:
      - name: 📥 Baixar os artefatos Android
        uses: actions/download-artifact@v4
        with:
          pattern: android-release-*
          merge-multiple: true
          path: release-files

      - name: 🔎 AAB presente? Já foi enviado?
        # Sem AAB não há o que publicar. A tag nasce logo após o upload, então
        # ela existir num re-run = versionCode já consumido na Play: pula o upload.
        id: estado
        run: |
          ls -la release-files/
          if ! ls release-files/*.aab >/dev/null 2>&1; then
            echo "::error::Nenhum .aab — o build do AAB não entregou."
            exit 1
          fi
          if ! ls release-files/*.apk >/dev/null 2>&1; then
            echo "::warning::APK ausente — a Release terá só o AAB."
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v$NOME" >/dev/null 2>&1; then
            echo "Tag v$NOME já existe (re-execução) — upload já feito."
            echo "enviado=true" >> "$GITHUB_OUTPUT"
          else
            echo "enviado=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🤖 AAB para a faixa de teste
        # A service account nem tem permissão de produção (docs/PLAY_SERVICE_ACCOUNT.md).
        if: steps.estado.outputs.enviado != 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.grimoriodebolso.app
          releaseFiles: release-files/*.aab
          track: ${{ needs.preparar.outputs.faixa }}
          status: completed

      - name: 🏷️ Tag no commit buildado
        if: steps.estado.outputs.enviado != 'true'
        run: gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$NOME" -f sha="$SHA"

      - name: 📝 GitHub Release em rascunho
        run: |
          if gh release view "v$NOME" >/dev/null 2>&1; then
            echo "Release v$NOME já existe."
            exit 0
          fi
          gh release create "v$NOME" release-files/* \
            --draft \
            --verify-tag \
            --title "Grimório de Bolso v$NOME" \
            --generate-notes \
            --notes "$(printf '%s\n\n%s\n%s\n' \
              "## v$NOME (versionCode $CODIGO)" \
              "- 🤖 AAB na faixa **\`$FAIXA\`** da Play — teste e promova na Play Console." \
              "- 📦 Commit: \`$SHA\`")"

  # ── Tempo 2: site em produção (aprovação do environment `production`) ──
  # Aprove depois de testar a faixa interna. Rejeitar = site não muda.
  producao-web:
    name: 🌐 Site em produção + Release publicada
    needs: [preparar, play-interno]
    if: always() && needs.play-interno.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://grimoriodebolso.app

    steps:
      # O checkout traz `functions/` (Pages Functions, ex.: /baixar).
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
          persist-credentials: false

      - name: 📥 Baixar o site
        uses: actions/download-artifact@v4
        with:
          name: site-release
          path: public

      - name: 🔎 Production branch do Cloudflare é `main`?
        # Senão o --branch=main abaixo seria só uma prévia.
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          atual=$(curl -sS --retry 2 -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/grimorio-de-bolso" \
            | jq -r '.result.production_branch // empty' || true)
          if [ "$atual" != "main" ]; then
            echo "::error::Production branch do projeto é '${atual:-ilegível}', não 'main'. Corrija no painel e re-execute."
            exit 1
          fi

      - name: 🚀 Site em produção (grimoriodebolso.app)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=grimorio-de-bolso --branch=main --commit-dirty=true

      - name: 🎉 Publicar a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOME: ${{ needs.preparar.outputs.version_name }}
        run: gh release edit "v$NOME" --draft=false --latest

  resumo:
    name: 📋 Resumo
    needs: [preparar, validar, build-android, build-web, play-interno, producao-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Escrever resumo
        env:
          NOME: ${{ needs.preparar.outputs.version_name }}
          CODIGO: ${{ needs.preparar.outputs.version_code }}
          SHA: ${{ needs.preparar.outputs.sha }}
          FAIXA: ${{ needs.preparar.outputs.faixa }}
          DRY: ${{ needs.preparar.outputs.dry_run }}
          R_PREPARAR: ${{ needs.preparar.result }}
          R_VALIDAR: ${{ needs.validar.result }}
          R_ANDROID: ${{ needs.build-android.result }}
          R_WEB: ${{ needs.build-web.result }}
          R_PLAY: ${{ needs.play-interno.result }}
          R_SITE: ${{ needs.producao-web.result }}
        run: |
          {
            if [ "$DRY" = "true" ]; then
              echo "## 🧪 Dry-run do release (nada publicado)"
              echo
              echo "\`v${NOME}\` é só a versão que SERIA usada. Os APK/AAB assinados estão em *Artifacts*."
            else
              echo "## 🚀 Release v${NOME}"
            fi
            echo
            echo "| Etapa | Status |"
            echo "|---|---|"
            echo "| Versão e guardas | $R_PREPARAR |"
            echo "| Gate de qualidade | $R_VALIDAR |"
            echo "| Build Android | $R_ANDROID |"
            echo "| Build web | $R_WEB |"
            echo "| Play (faixa \`$FAIXA\`) + Release rascunho | $R_PLAY |"
            echo "| Site em produção + Release publicada | $R_SITE |"
            echo
            echo "versionCode: \`${CODIGO}\` · commit: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
