name: 🧪 CI - Pull Request

# Valida código em pull requests antes do merge
# Garante qualidade e previne bugs em produção
#
# Executa:
#   • Flutter analyze (análise estática)
#   • Flutter test (testes unitários)
#   • Test build APK (garante que compila)

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

env:
  FLUTTER_VERSION: '3.27.0'
  JAVA_VERSION: '17'

jobs:
  validate:
    name: ✅ Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Check formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: 🔍 Run flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run tests
        run: flutter test --coverage --reporter=github

      - name: 📊 Generate coverage report
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: 🏗️ Test build APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL=dummy --dart-define=SUPABASE_ANON_KEY=dummy

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🧪 CI Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting check" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis (flutter analyze)" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests" >> $GITHUB_STEP_SUMMARY
          echo "- Test build (debug APK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "### 🎉 All checks passed!" >> $GITHUB_STEP_SUMMARY
            echo "This PR is ready to merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some checks failed" >> $GITHUB_STEP_SUMMARY
            echo "Please review the logs above and fix the issues." >> $GITHUB_STEP_SUMMARY
          fi
