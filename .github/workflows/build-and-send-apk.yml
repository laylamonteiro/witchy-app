name: Build Android APK

# Workflow de validação para branches de trabalho
# - Valida código e faz build
# - Se passar, cria PR para main automaticamente
# - Na main, use o workflow "Build APK - Download no Celular" que gera releases

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  build-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Create Groq credentials file (dummy for validation)
        run: |
          cat > lib/core/ai/groq_credentials.dart << 'CREDENTIALS'
          /// Credentials for the Groq API.
          class GroqCredentials {
            static const apiKey = 'dummy-key-for-validation';
          }
          CREDENTIALS

      - name: Create Prokerala credentials file (dummy for validation)
        run: |
          cat > lib/features/astrology/data/services/prokerala_credentials.dart << 'CREDENTIALS'
          /// Credentials for the Prokerala API.
          class ProkeralaCredentials {
            static const String clientId = 'dummy-id';
            static const String clientSecret = 'dummy-secret';
          }
          CREDENTIALS

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build APK (validation only)
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://dummy.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=dummy-key \
            --dart-define=REVENUECAT_ANDROID_KEY=dummy-key \
            --dart-define=REVENUECAT_IOS_KEY=dummy-key

      - name: Build validation complete
        run: |
          echo "✅ Build compilado com sucesso!"
          echo ""
          echo "📋 Próximos passos:"
          echo "1. Revise as mudanças"
          echo "2. Faça merge para 'main' para gerar build de produção"
          echo "3. O workflow completo rodará automaticamente após o merge"
