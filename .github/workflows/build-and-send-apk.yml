name: Build Android APK

# Workflow simplificado para branches de trabalho
# - Valida código com flutter analyze
# - Abre PR para main automaticamente se passar
# - Build completo só roda na main após merge

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verificar se já existe PR aberto para esta branch
          EXISTING_PR=$(gh pr list --head ${{ github.ref_name }} --base main --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            echo "Criando novo Pull Request..."
            gh pr create \
              --base main \
              --head ${{ github.ref_name }} \
              --title "🚀 ${{ github.ref_name }}" \
              --body "## ✅ Validação Automática Concluída

          - Código analisado com \`flutter analyze\`
          - Dependências verificadas
          - Pronto para merge

          ### 📋 Próximos passos:
          1. Revise as mudanças
          2. Faça merge para gerar build de produção
          3. Build completo (APK/AAB) rodará automaticamente na main

          ---
          *PR criado automaticamente pelo workflow de validação*"
          else
            echo "Pull Request #$EXISTING_PR já existe para esta branch"
          fi
