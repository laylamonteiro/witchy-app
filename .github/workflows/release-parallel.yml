name: 🚀 Build & Release

 

# Workflow único que roda em push para main

# Incrementa versão automaticamente e builda APK + AAB em paralelo

#

# Arquitetura:

#   1. Auto-increment & Prepare (1 min) → 2. Validate (2 min) →

#   3. Build APK (7 min) + 4. Build AAB (7 min) em PARALELO ⚡ →

#   5. Create Release (1 min) → 6. Summary (<1 min)

#

# Total: ~11 minutos

 

on:

  push:

    branches:

      - main

    paths-ignore:

      - '**.md'

      - 'docs/**'

      - '.gitignore'

 

env:

  FLUTTER_VERSION: '3.24.5' # Atualizado para resolver problemas com sqlite3 native assets

  JAVA_VERSION: '17'

 

jobs:

  # ══════════════════════════════════════════════════════════════════════════

  # Job 1: AUTO-INCREMENT & PREPARE

  # Tempo: ~1 min

  # Incrementa versão e prepara ambiente

  # ══════════════════════════════════════════════════════════════════════════

  auto-increment-and-prepare:

    name: 🔢 Auto-Increment & Prepare

    runs-on: ubuntu-latest

 

    # Permissões para fazer commit e push

    permissions:

      contents: write

 

    # Evita loops infinitos: não roda se commit foi feito pelo bot

    if: |

      !contains(github.event.head_commit.message, '[skip ci]') &&

      github.event.head_commit.author.name != 'github-actions[bot]'

 

    outputs:

      version: ${{ steps.increment.outputs.version }}

      version_name: ${{ steps.increment.outputs.version_name }}

      version_code: ${{ steps.increment.outputs.version_code }}

 

    steps:

      - name: 📥 Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          token: ${{ secrets.GITHUB_TOKEN }}

          persist-credentials: true

 

      - name: 🔢 Auto-increment build number

        id: increment

        run: |

          # Lê versão atual

          CURRENT_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')

          echo "📌 Versão atual: $CURRENT_VERSION"

 

          # Separa version name e version code

          VERSION_NAME=$(echo $CURRENT_VERSION | cut -d'+' -f1)

          VERSION_CODE=$(echo $CURRENT_VERSION | cut -d'+' -f2)

 

          # Incrementa apenas o build number

          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          NEW_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"

 

          echo "✨ Nova versão: $NEW_VERSION"

 

          # Atualiza pubspec.yaml

          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

 

          # Define outputs

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

          echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT

 

      - name: 💾 Commit version bump

        run: |

          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git config --local user.name "github-actions[bot]"

 

          git add pubspec.yaml

 

          if git diff --staged --quiet; then

            echo "⏭️ No changes to commit"

          else

            git commit -m "chore: auto-increment version to ${{ steps.increment.outputs.version }} [skip ci]"

            git push

            echo "✅ Version bumped and pushed"

          fi

 

      - name: 📤 Upload pubspec.yaml

        uses: actions/upload-artifact@v4

        with:

          name: pubspec-yaml

          path: pubspec.yaml

          retention-days: 1

 

  # ══════════════════════════════════════════════════════════════════════════

  # Job 2: VALIDATE

  # Tempo: ~2 min

  # Roda testes

  # ══════════════════════════════════════════════════════════════════════════

  validate:

    name: ✅ Validate & Test

    runs-on: ubuntu-latest

    needs: [auto-increment-and-prepare]

 

    steps:

      - name: 📥 Checkout repository

        uses: actions/checkout@v4

 

      - name: 📥 Download pubspec.yaml

        uses: actions/download-artifact@v4

        with:

          name: pubspec-yaml

 

      - name: 🐦 Setup Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: stable
          cache: true

 

      - name: 📦 Install dependencies

        run: flutter pub get

 

      - name: 🔍 Check formatting

        run: dart format --output=none --set-exit-if-changed .

        continue-on-error: true

 

      - name: 🧪 Run tests

        run: flutter test --coverage || echo "⚠️ Tests failed but continuing..."

 

  # ══════════════════════════════════════════════════════════════════════════

  # Job 3: BUILD APK (PARALELO COM JOB 4) ⚡

  # Tempo: ~7 min

  # Gera APK para instalação direta

  # ══════════════════════════════════════════════════════════════════════════

  build-apk:

    name: 📱 Build APK

    runs-on: ubuntu-latest

    needs: [auto-increment-and-prepare, validate]



    env:

      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE || 'JKS' }}



    steps:

      - name: 📥 Checkout repository

        uses: actions/checkout@v4



      - name: 📥 Download pubspec.yaml

        uses: actions/download-artifact@v4

        with:

          name: pubspec-yaml

      - name: 🧹 Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h



      - name: ☕ Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: ${{ env.JAVA_VERSION }}


      - name: 🐦 Setup Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: stable
          cache: true



      - name: 📦 Install dependencies

        run: flutter pub get



      - name: 🧹 Clean build cache

        run: |

          flutter clean

          rm -rf build/

          echo "✅ Build cache cleared"



      - name: 🔐 Create google-services.json

        run: |

          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 -d > android/app/google-services.json



      - name: 🔐 Create Groq credentials file

        run: |

          cat > lib/core/ai/groq_credentials.dart << 'CREDENTIALS'

          /// Credentials for the Groq API.

          ///

          class GroqCredentials {

            static const apiKey = '${{ secrets.GROQ_API_KEY }}';

          }

          CREDENTIALS



      - name: 🔐 Create Prokerala credentials file

        run: |

          cat > lib/features/astrology/data/services/prokerala_credentials.dart << 'CREDENTIALS'

          /// Credentials for the Prokerala API.

          ///

          class ProkeralaCredentials {

            static const String clientId = '${{ secrets.PROKERALA_CLIENT_ID }}';

            static const String clientSecret = '${{ secrets.PROKERALA_CLIENT_SECRET }}';

          }

          CREDENTIALS



      - name: 🔑 Prepare Android signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "✅ Keystore decoded from base64"
          else
            echo "⚠️ Base64 decode failed, writing secret as-is"
            printf "%s" "$ANDROID_KEYSTORE_BASE64" > "$KEYSTORE_PATH"
          fi
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "Keystore saved to $KEYSTORE_PATH"



      - name: 🔑 Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          {
            echo "storeFile=${ANDROID_KEYSTORE_FILE}"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "storeType=${ANDROID_KEYSTORE_TYPE}"
          } > android/key.properties
          echo "✅ key.properties created"



      - name: ✅ Validate keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "🔍 Validating keystore access..."
          if keytool -list \
            -keystore "${ANDROID_KEYSTORE_FILE}" \
            -storepass "${ANDROID_STORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            > /dev/null 2>&1; then
            echo "✅ Keystore validated successfully!"
          else
            echo "❌ Failed to access keystore"
            exit 1
          fi



      - name: ⚠️ Warn if APK will be debug-signed
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 ausente — o APK será assinado em DEBUG."
          echo "::warning::O login com Google (google_sign_in) FALHARÁ com ApiException: 10."
          echo "::warning::Configure os secrets ANDROID_KEYSTORE_BASE64/ALIAS/PASSWORD no repositório."



      - name: 📱 Build APK
        # Secrets entram via env e expandem entre aspas: valores com
        # caracteres especiais de shell (;, &, $, quebras de linha) nao
        # quebram o script nem vazam no log.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY" \
            --dart-define=REVENUECAT_IOS_KEY="$REVENUECAT_IOS_KEY" \
            --dart-define=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --dart-define=ADMIN_PASSWORD="$ADMIN_PASSWORD"



      - name: 🔎 Print APK signing SHA-1 (para configurar Google Sign-In)
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "════════════════════════════════════════════════════════════"
          echo " SHA-1 da assinatura do APK — registre no Google Cloud Console"
          echo " (APIs & Services → Credentials → OAuth client ID Android)"
          echo " Package: com.grimoriodebolso.app"
          echo "════════════════════════════════════════════════════════════"
          # apksigner é o método mais confiável (v2/v3); keytool como fallback (v1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1\|SHA-256" || true
          else
            keytool -printcert -jarfile "$APK" | grep -i "SHA1\|SHA256" || \
              echo "⚠️ Não foi possível extrair o SHA-1 (APK sem assinatura v1?). Use o keystore localmente."
          fi
          echo "════════════════════════════════════════════════════════════"
          echo " O SHA-1 acima PRECISA estar registrado como OAuth client"
          echo " Android no Google Cloud (projeto grimorio-de-bolso), senão o"
          echo " login Google falha com ApiException: 10."
          echo " Keystore atual dos Secrets (registrado em 07/2026):"
          echo "   54:84:54:75:7F:A8:37:1C:21:F4:B9:71:E7:B7:F8:05:25:85:FB:60"
          echo " Guia completo: docs/GOOGLE_SIGNIN_SETUP.md"
          echo "════════════════════════════════════════════════════════════"



      - name: 📝 Rename APK
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "release-artifacts/grimorio-de-bolso-${{ needs.auto-increment-and-prepare.outputs.version }}.apk"

 

      - name: 📤 Upload APK artifact

        uses: actions/upload-artifact@v4

        with:

          name: apk-release

          path: release-artifacts/*.apk

          retention-days: 30

 

  # ══════════════════════════════════════════════════════════════════════════

  # Job 4: BUILD AAB (PARALELO COM JOB 3) ⚡

  # Tempo: ~7 min

  # Gera AAB para Play Store

  # ══════════════════════════════════════════════════════════════════════════

  build-aab:

    name: 📦 Build AAB

    runs-on: ubuntu-latest

    needs: [auto-increment-and-prepare, validate]



    env:

      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE || 'JKS' }}



    steps:

      - name: 📥 Checkout repository

        uses: actions/checkout@v4



      - name: 📥 Download pubspec.yaml

        uses: actions/download-artifact@v4

        with:

          name: pubspec-yaml

      - name: 🧹 Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h



      - name: ☕ Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: ${{ env.JAVA_VERSION }}


      - name: 🐦 Setup Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: stable
          cache: true



      - name: 📦 Install dependencies

        run: flutter pub get



      - name: 🧹 Clean build cache

        run: |

          flutter clean

          rm -rf build/

          echo "✅ Build cache cleared"



      - name: 🔐 Create google-services.json

        run: |

          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 -d > android/app/google-services.json



      - name: 🔐 Create Groq credentials file

        run: |

          cat > lib/core/ai/groq_credentials.dart << 'CREDENTIALS'

          /// Credentials for the Groq API.

          ///

          class GroqCredentials {

            static const apiKey = '${{ secrets.GROQ_API_KEY }}';

          }

          CREDENTIALS



      - name: 🔐 Create Prokerala credentials file

        run: |

          cat > lib/features/astrology/data/services/prokerala_credentials.dart << 'CREDENTIALS'

          /// Credentials for the Prokerala API.

          ///

          class ProkeralaCredentials {

            static const String clientId = '${{ secrets.PROKERALA_CLIENT_ID }}';

            static const String clientSecret = '${{ secrets.PROKERALA_CLIENT_SECRET }}';

          }

          CREDENTIALS



      - name: 🔑 Prepare Android signing keystore

        if: env.ANDROID_KEYSTORE_BASE64 != ''

        run: |

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

 

          if echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH" 2>/dev/null; then

            echo "✅ Keystore decoded from base64"

          else

            echo "⚠️ Base64 decode failed, writing secret as-is"

            printf "%s" "$ANDROID_KEYSTORE_BASE64" > "$KEYSTORE_PATH"

          fi

 

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV

          echo "Keystore saved to $KEYSTORE_PATH"

 

      - name: 🔑 Create key.properties

        if: env.ANDROID_KEYSTORE_BASE64 != ''

        run: |

          {

            echo "storeFile=${ANDROID_KEYSTORE_FILE}"

            echo "storePassword=${ANDROID_STORE_PASSWORD}"

            echo "keyAlias=${ANDROID_KEY_ALIAS}"

            echo "keyPassword=${ANDROID_KEY_PASSWORD}"

            echo "storeType=${ANDROID_KEYSTORE_TYPE}"

          } > android/key.properties

 

          echo "✅ key.properties created"

 

      - name: ✅ Validate keystore

        if: env.ANDROID_KEYSTORE_BASE64 != ''

        run: |
          echo "🔍 Validating keystore access..."

          if keytool -list \
            -keystore "${ANDROID_KEYSTORE_FILE}" \
            -storepass "${ANDROID_STORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            > /dev/null 2>&1; then
            echo "✅ Keystore validated successfully!"
          else
            echo "❌ Failed to access keystore"
            exit 1
          fi

 

      - name: 📦 Build AAB
        # Secrets entram via env e expandem entre aspas: valores com
        # caracteres especiais de shell (;, &, $, quebras de linha) nao
        # quebram o script nem vazam no log.
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY" \
            --dart-define=REVENUECAT_IOS_KEY="$REVENUECAT_IOS_KEY" \
            --dart-define=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --dart-define=ADMIN_PASSWORD="$ADMIN_PASSWORD"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}

          REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}

          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}

          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

 

      - name: 🐛 Prepare debug symbols

        run: |

          echo "📋 Copying debug symbols..."

          mkdir -p release-artifacts/symbols

 

          if [ -d "build/app/outputs/symbols" ]; then

            cp -r build/app/outputs/symbols/* release-artifacts/symbols/

            cd release-artifacts/symbols

            zip -r "../grimorio-de-bolso-${{ needs.auto-increment-and-prepare.outputs.version }}-symbols.zip" .

            cd ../..

            echo "✅ Debug symbols packaged"

          else

            echo "⚠️ No debug symbols found"

          fi

 

      - name: 📝 Rename AAB
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab \
             "release-artifacts/grimorio-de-bolso-${{ needs.auto-increment-and-prepare.outputs.version }}.aab"

 

      - name: 📤 Upload AAB artifact

        uses: actions/upload-artifact@v4

        with:

          name: aab-release

          path: release-artifacts/*.aab

          retention-days: 30

 

      - name: 📤 Upload debug symbols

        uses: actions/upload-artifact@v4

        with:

          name: debug-symbols

          path: release-artifacts/*-symbols.zip

          retention-days: 30

        if: success()

 

  # ══════════════════════════════════════════════════════════════════════════

  # Job 5: CREATE RELEASE

  # Tempo: ~1 min

  # Cria GitHub Release com APK e AAB

  # ══════════════════════════════════════════════════════════════════════════

  create-release:

    name: 🎉 Create Release

    runs-on: ubuntu-latest

    needs: [auto-increment-and-prepare, build-apk, build-aab]

 

    permissions:

      contents: write

 

    steps:

      - name: 📥 Checkout repository

        uses: actions/checkout@v4

 

      - name: 📥 Download APK

        uses: actions/download-artifact@v4

        with:

          name: apk-release

          path: release-files/

 

      - name: 📥 Download AAB

        uses: actions/download-artifact@v4

        with:

          name: aab-release

          path: release-files/

 

      - name: 📥 Download debug symbols

        uses: actions/download-artifact@v4

        with:

          name: debug-symbols

          path: release-files/

        continue-on-error: true

 

      - name: 🎉 Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: v${{ needs.auto-increment-and-prepare.outputs.version }}

          name: "Grimório de Bolso v${{ needs.auto-increment-and-prepare.outputs.version }}"

          body: |

            ## 🌙 Grimório de Bolso - Versão ${{ needs.auto-increment-and-prepare.outputs.version }}

 

            ### 📥 Downloads Disponíveis

 

            #### 📱 APK (Instalação Direta)

            Para instalar diretamente no Android sem Google Play Store.

            - Baixe o arquivo `.apk`

            - Abra no celular e permita instalação de fontes desconhecidas

 

            #### 📦 AAB (Google Play Store)

            Para publicar na Google Play Console.

            - Baixe o arquivo `.aab`

            - Faça upload na Play Console

 

            #### 🐛 Debug Symbols

            Símbolos de depuração para análise de crashes na Play Console.

            - Baixe o arquivo `*-symbols.zip`

            - Faça upload junto com o AAB na Play Console

 

            ### 📊 Informações do Build

            - **Versão**: ${{ needs.auto-increment-and-prepare.outputs.version_name }}

            - **Build Number**: ${{ needs.auto-increment-and-prepare.outputs.version_code }}

            - **Branch**: ${{ github.ref_name }}

            - **Commit**: ${{ github.sha }}

            - **Construído por**: GitHub Actions

 

            ### 🔧 Build em Paralelo ⚡

            APK e AAB buildados simultaneamente para máxima velocidade!

 

            ---

 

            *Build automático gerado a cada push para main*

          files: release-files/*

          draft: false

          prerelease: false

          generate_release_notes: true

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

 

  # ══════════════════════════════════════════════════════════════════════════

  # Job 6: SUMMARY

  # Tempo: <1 min

  # Gera resumo final

  # ══════════════════════════════════════════════════════════════════════════

  summary:

    name: 📊 Build Summary

    runs-on: ubuntu-latest

    needs: [auto-increment-and-prepare, validate, build-apk, build-aab, create-release]

    if: always()

 

    steps:

      - name: 📊 Generate summary

        run: |

          echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY

          echo "- **Version**: ${{ needs.auto-increment-and-prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY

          echo "- **Version Name**: ${{ needs.auto-increment-and-prepare.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY

          echo "- **Build Number**: ${{ needs.auto-increment-and-prepare.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Job Status" >> $GITHUB_STEP_SUMMARY

          echo "- **Auto-Increment**: ${{ needs.auto-increment-and-prepare.result }}" >> $GITHUB_STEP_SUMMARY

          echo "- **Validate**: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY

          echo "- **Build APK**: ${{ needs.build-apk.result }}" >> $GITHUB_STEP_SUMMARY

          echo "- **Build AAB**: ${{ needs.build-aab.result }}" >> $GITHUB_STEP_SUMMARY

          echo "- **Create Release**: ${{ needs.create-release.result }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📥 Artifacts" >> $GITHUB_STEP_SUMMARY

          echo "Os artifacts estão disponíveis na aba **Artifacts** deste workflow." >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Release" >> $GITHUB_STEP_SUMMARY

          echo "Acesse: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.auto-increment-and-prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY

