name: 🚀 Build & Release Android (Parallel)

# Workflow otimizado com builds paralelos de APK e AAB
# Economia de ~5 minutos (~30%) comparado com workflow sequencial
#
# Arquitetura:
#   1. Prepare & Version (1 min) → 2. Validate (3 min) →
#   3. Build APK (7 min) + 4. Build AAB (7 min) em PARALELO ⚡ →
#   5. Create Release (1 min) → 6. Upload Play Store (2 min, opcional) →
#   7. Summary (<1 min)
#
# Total: ~14 minutos (vs ~19 min no workflow sequencial)

on:
  push:
    tags:
      - 'v*'  # Dispara em tags como v1.0.0, v1.1.0, etc.
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Tipo de incremento de versão'
        required: true
        type: choice
        options:
          - build   # 1.0.0+5 → 1.0.0+6
          - patch   # 1.0.0 → 1.0.1
          - minor   # 1.0.0 → 1.1.0
          - major   # 1.0.0 → 2.0.0
        default: 'build'
      create_release:
        description: 'Criar GitHub Release?'
        required: false
        type: boolean
        default: true
      upload_to_play_store:
        description: 'Upload para Play Store?'
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.27.0'
  JAVA_VERSION: '17'

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Job 1: PREPARE & VERSION
  # Tempo: ~1 min
  # Responsabilidade: Incrementa versão e prepara ambiente
  # ══════════════════════════════════════════════════════════════════════════
  prepare:
    name: 🔧 Prepare & Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔢 Increment version
        id: version
        run: |
          # Le versão atual do pubspec.yaml
          CURRENT_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          echo "📌 Versão atual: $CURRENT_VERSION"

          # Separa version name e version code
          VERSION_NAME=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $CURRENT_VERSION | cut -d'+' -f2)

          # Determina tipo de incremento
          INCREMENT_TYPE="${{ github.event.inputs.increment_type || 'build' }}"
          echo "🔄 Tipo de incremento: $INCREMENT_TYPE"

          if [ "$INCREMENT_TYPE" == "build" ]; then
            # Incrementa apenas build number
            NEW_VERSION_CODE=$((VERSION_CODE + 1))
            NEW_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"
          else
            # Incrementa version name (patch/minor/major)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"

            case "$INCREMENT_TYPE" in
              patch)
                PATCH=$((PATCH + 1))
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
            esac

            NEW_VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
            NEW_VERSION_CODE=$((VERSION_CODE + 1))
            NEW_VERSION="${NEW_VERSION_NAME}+${NEW_VERSION_CODE}"
          fi

          echo "✨ Nova versão: $NEW_VERSION"

          # Atualiza pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          # Define outputs
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$(echo $NEW_VERSION | cut -d'+' -f1)" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $NEW_VERSION | cut -d'+' -f2)" >> $GITHUB_OUTPUT

      - name: 💾 Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: 📤 Upload pubspec.yaml
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-yaml
          path: pubspec.yaml
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2: VALIDATE CODE
  # Tempo: ~2-3 min
  # Responsabilidade: Valida qualidade do código antes de buildar
  # ══════════════════════════════════════════════════════════════════════════
  validate:
    name: ✅ Validate Code
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download pubspec.yaml
        uses: actions/download-artifact@v4
        with:
          name: pubspec-yaml

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Run flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run tests
        run: flutter test --coverage || echo "⚠️ Tests failed but continuing..."

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3: BUILD APK (PARALELO COM JOB 4) ⚡
  # Tempo: ~5-7 min
  # Responsabilidade: Gera APK para instalação direta
  # ══════════════════════════════════════════════════════════════════════════
  build-apk:
    name: 📱 Build APK
    runs-on: ubuntu-latest
    needs: [prepare, validate]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download pubspec.yaml
        uses: actions/download-artifact@v4
        with:
          name: pubspec-yaml

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 📱 Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }} \
            --dart-define=REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}

      - name: 📝 Rename APK
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "release-artifacts/grimorio-de-bolso-${{ needs.prepare.outputs.version }}.apk"

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: release-artifacts/*.apk
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  # Job 4: BUILD AAB (PARALELO COM JOB 3) ⚡
  # Tempo: ~5-7 min
  # Responsabilidade: Gera AAB para Play Store
  # ══════════════════════════════════════════════════════════════════════════
  build-aab:
    name: 📦 Build AAB
    runs-on: ubuntu-latest
    needs: [prepare, validate]

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE || 'JKS' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download pubspec.yaml
        uses: actions/download-artifact@v4
        with:
          name: pubspec-yaml

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔐 Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 -d > android/app/google-services.json

      - name: 🔑 Prepare Android signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          if echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "✅ Keystore decoded from base64"
          else
            echo "⚠️ Base64 decode failed, writing secret as-is"
            printf "%s" "$ANDROID_KEYSTORE_BASE64" > "$KEYSTORE_PATH"
          fi

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "Keystore saved to $KEYSTORE_PATH"

      - name: 🔑 Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          {
            echo "storeFile=${ANDROID_KEYSTORE_FILE}"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "storeType=${ANDROID_KEYSTORE_TYPE}"
          } > android/key.properties

          echo "✅ key.properties created"

      - name: ✅ Validate keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "🔍 Validating keystore access..."

          if keytool -list \
            -keystore "${ANDROID_KEYSTORE_FILE}" \
            -storepass "${ANDROID_STORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            > /dev/null 2>&1; then
            echo "✅ Keystore validated successfully!"
          else
            echo "❌ Failed to access keystore"
            exit 1
          fi

      - name: 📦 Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }} \
            --dart-define=REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: 🐛 Prepare debug symbols
        run: |
          echo "📋 Copying debug symbols..."
          mkdir -p release-artifacts/symbols

          if [ -d "build/app/outputs/symbols" ]; then
            cp -r build/app/outputs/symbols/* release-artifacts/symbols/
            cd release-artifacts/symbols
            zip -r "../grimorio-de-bolso-${{ needs.prepare.outputs.version }}-symbols.zip" .
            cd ../..
            echo "✅ Debug symbols packaged"
          else
            echo "⚠️ No debug symbols found"
          fi

      - name: 📝 Rename AAB
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab \
             "release-artifacts/grimorio-de-bolso-${{ needs.prepare.outputs.version }}.aab"

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: release-artifacts/*.aab
          retention-days: 30

      - name: 📤 Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: release-artifacts/*-symbols.zip
          retention-days: 30
        if: success()

  # ══════════════════════════════════════════════════════════════════════════
  # Job 5: CREATE RELEASE
  # Tempo: ~1 min
  # Responsabilidade: Cria GitHub Release com APK e AAB
  # ══════════════════════════════════════════════════════════════════════════
  create-release:
    name: 🎉 Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build-apk, build-aab]
    if: github.event.inputs.create_release != 'false'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: release-files/

      - name: 📥 Download AAB
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: release-files/

      - name: 📥 Download debug symbols
        uses: actions/download-artifact@v4
        with:
          name: debug-symbols
          path: release-files/
        continue-on-error: true

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: "Grimório de Bolso v${{ needs.prepare.outputs.version }}"
          body: |
            ## 🌙 Grimório de Bolso - Versão ${{ needs.prepare.outputs.version }}

            ### 📥 Downloads Disponíveis

            #### 📱 APK (Instalação Direta)
            Para instalar diretamente no Android sem Google Play Store.
            - Baixe o arquivo `.apk`
            - Abra no celular e permita instalação de fontes desconhecidas

            #### 📦 AAB (Google Play Store)
            Para publicar na Google Play Console.
            - Baixe o arquivo `.aab`
            - Faça upload na Play Console

            #### 🐛 Debug Symbols
            Símbolos de depuração para análise de crashes na Play Console.
            - Baixe o arquivo `*-symbols.zip`
            - Faça upload junto com o AAB na Play Console

            ### 📊 Informações do Build
            - **Versão**: ${{ needs.prepare.outputs.version_name }}
            - **Build Number**: ${{ needs.prepare.outputs.version_code }}
            - **Branch**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            - **Construído por**: GitHub Actions

            ### 🔧 Build em Paralelo ⚡
            Este build utilizou arquitetura paralela:
            - APK e AAB buildados simultaneamente
            - Economia de ~30% no tempo de build
            - Builds isolados e resilientes

            ---

            *Build automático gerado via GitHub Actions*
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════
  # Job 6: UPLOAD TO PLAY STORE (Opcional)
  # Tempo: ~1-2 min
  # Responsabilidade: Faz upload automático para Play Store
  # ══════════════════════════════════════════════════════════════════════════
  upload-play-store:
    name: 🎮 Upload to Play Store
    runs-on: ubuntu-latest
    needs: [prepare, build-aab]
    if: |
      github.event.inputs.upload_to_play_store == 'true' &&
      secrets.PLAY_STORE_JSON_KEY != ''

    steps:
      - name: 📥 Download AAB
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: release-files/

      - name: 🎮 Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.grimoriodebolso.app
          releaseFiles: release-files/*.aab
          track: internal  # Opções: internal, alpha, beta, production
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: fastlane/metadata/android/pt-BR/changelogs

  # ══════════════════════════════════════════════════════════════════════════
  # Job 7: BUILD SUMMARY
  # Tempo: <1 min
  # Responsabilidade: Gera resumo final da execução
  # ══════════════════════════════════════════════════════════════════════════
  summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [prepare, validate, build-apk, build-aab, create-release]
    if: always()

    steps:
      - name: 📊 Generate summary
        run: |
          echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name**: ${{ needs.prepare.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ needs.prepare.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Prepare**: ${{ needs.prepare.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Validate**: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build APK**: ${{ needs.build-apk.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build AAB**: ${{ needs.build-aab.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Create Release**: ${{ needs.create-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Os artifacts estão disponíveis na aba **Artifacts** deste workflow." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Release" >> $GITHUB_STEP_SUMMARY
          echo "Se o release foi criado, acesse: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Build paralelo concluído* ⚡" >> $GITHUB_STEP_SUMMARY
